---
- name: Include OS family variables
  include_vars: "{{ ansible_os_family }}.yml"
  ignore_errors: true

- name: Update package cache (Debian)
  apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == 'Debian'
  become: true

- name: Update package cache (RedHat)
  yum:
    update_cache: true
  when: ansible_os_family == 'RedHat'
  become: true

- name: Install base/common packages (Debian/Ubuntu)
  apt:
    name: "{{ ubuntu_packages }}"
    state: present
  when: ansible_os_family == 'Debian'
  become: true

- name: Install base/common packages (CentOS/RHEL)
  yum:
    name: "{{ centos_packages }}"
    state: present
  when: ansible_os_family == 'RedHat'
  become: true

- name: Ensure common working directory exists
  file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"
  become: true
