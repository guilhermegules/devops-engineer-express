# Redis package is taken from the distro repositories (Ubuntu/Debian ship 6.x
# or 7.x, which is more than enough for the homework).
redis_port: 6379
redis_bind: "127.0.0.1"
redis_protected_mode: "yes"
redis_appendonly: "yes"
redis_maxmemory: "256mb"

redis_config_file: /etc/redis/redis.conf
redis_service: "{{ 'redis-server' if ansible_os_family == 'Debian' else 'redis' }}"
