# Apache Kafka, installed from the official tarball in KRaft mode (no
# ZooKeeper). The archive URL points at archive.apache.org, which keeps every
# release forever, unlike downloads.apache.org which only hosts current ones.
kafka_version: "3.9.2"
kafka_scala_version: "2.13"
kafka_tarball: "kafka_{{ kafka_scala_version }}-{{ kafka_version }}.tgz"
kafka_download_url: >-
  https://archive.apache.org/dist/kafka/{{ kafka_version }}/{{ kafka_tarball }}

kafka_user: kafka
kafka_group: kafka
kafka_install_dir: /opt/kafka
kafka_version_dir: "/opt/kafka-{{ kafka_version }}"
kafka_config_dir: /etc/kafka
kafka_config_file: /etc/kafka/server.properties
kafka_data_dir: /var/lib/kafka/data
kafka_log_dir: /var/log/kafka
kafka_service: kafka

kafka_node_id: 1
kafka_port: 9092
kafka_controller_port: 9093
kafka_advertised_host: "127.0.0.1"
