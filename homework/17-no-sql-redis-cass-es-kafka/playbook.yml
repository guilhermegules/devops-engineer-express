---
# Homework 17 - NoSQL: Redis, Cassandra, Elasticsearch, Kafka.
#
# One custom role per datastore, applied to the [nosql] group. The `common`
# role installs the shared prerequisites (apt keyrings, curl, Java 11) and is
# listed first so every service role can rely on them.
#
# Run everything:  ansible-playbook -i inventory/hosts.ini playbook.yml
# Run one service: ansible-playbook playbook.yml --tags redis
- name: Provision the NoSQL stack
  hosts: nosql
  become: true
  gather_facts: true

  roles:
    - role: common
      tags: [common, prerequisites]
    - role: redis
      tags: [redis]
    - role: elasticsearch
      tags: [elasticsearch, es]
    - role: cassandra
      tags: [cassandra, cass]
    - role: kafka
      tags: [kafka]

  post_tasks:
    - name: NoSQL provisioning finished
      debug:
        msg: >-
          Redis ({{ redis_port }}), Elasticsearch ({{ elasticsearch_http_port }}),
          Cassandra ({{ cassandra_native_port }}) and Kafka ({{ kafka_port }})
          are installed and running on {{ inventory_hostname }}. Run
          scripts/verify-nosql.sh to check the endpoints.
