[all:vars]
ansible_user=vagrant
ansible_ssh_private_key_file=~/.vagrant.d/insecure_private_key
ansible_python_interpreter=/usr/bin/python3

; The four datastores are co-located on a single host by default (like the
; sample Go clients in source/nosql that connect to localhost). Add more hosts
; to the group to spread the stack across machines.
[nosql]
vm1 ansible_host=10.0.0.10
