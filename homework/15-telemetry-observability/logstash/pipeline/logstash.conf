# Logstash pipeline for homework 15.
#
# Three inputs feed Elasticsearch:
#   * http      - collectd write_http posts one JSON array of value lists, and
#                 the json codec turns every element of that array into an event.
#   * file      - the microservice's own stdout/stderr, one message per line.
#   * file      - collectd's log messages, already written as Logstash JSON by
#                 the collectd log_logstash plugin.

input {
  http {
    id    => "collectd-metrics"
    host  => "0.0.0.0"
    port  => 8080
    # collectd posts one JSON array of value lists, so every element becomes its
    # own event. The json codec target is not honoured for a root level array,
    # so these fields stay at the top level and the ruby filter below maps them
    # into the metric namespace.
    codec => json
    tags  => ["collectd", "metric"]
  }

  file {
    id             => "calculator-app-log"
    path           => "/var/log/calculator/calculator.log"
    codec          => plain
    start_position => "beginning"
    sincedb_path   => "/usr/share/logstash/data/.sincedb_calculator_app"
    tags           => ["calculator", "app"]
  }

  file {
    id             => "collectd-log"
    path           => "/var/log/calculator/collectd-logs.json"
    codec          => json
    start_position => "beginning"
    sincedb_path   => "/usr/share/logstash/data/.sincedb_collectd_log"
    tags           => ["collectd", "collectdlog"]
  }
}

filter {
  if "metric" in [tags] {
    # A collectd value list keeps its data set names and values in two parallel
    # arrays. Flatten them into metric.values.<name> so Kibana can chart a
    # single numeric field, and derive a stable identity for the series.
    ruby {
      id   => "flatten-collectd-value-list"
      code => '
        names  = event.get("dsnames") || []
        values = event.get("values")  || []

        names.each_with_index do |name, idx|
          next if values[idx].nil?
          event.set("[metric][values][#{name}]", values[idx])
        end

        plugin = event.get("plugin")          || "unknown"
        p_inst = event.get("plugin_instance") || ""
        type   = event.get("type")            || "unknown"
        t_inst = event.get("type_instance")   || ""

        parts = [plugin, p_inst, type, t_inst].reject { |part| part.to_s.empty? }
        event.set("[metric][name]", parts.join("."))
        event.set("[metric][source]", plugin)
        event.set("[metric][type]", type)
        event.set("[metric][instance]", t_inst)
        # The http input sets host to the address collectd shipped from, which
        # replaces collectd own host field, so use it as the series host.
        event.set("[metric][host]", event.get("host") || "")

        # collectd sends the collection time as epoch seconds. Pass it on in
        # milliseconds and let the date filter below build @timestamp, because
        # the ruby filter cannot set @timestamp directly.
        collected_at = event.get("time")
        if collected_at
          event.set("[@metadata][collected_at_ms]", (collected_at * 1000).round)
        end

        event.remove("values")
        event.remove("dstypes")
        event.remove("time")
      '
    }

    date {
      id     => "collectd-collection-time"
      match  => [ "[@metadata][collected_at_ms]", "UNIX_MS" ]
      target => "@timestamp"
    }

    mutate {
      add_field => { "[@metadata][index_prefix]" => "calculator-metrics" }
    }
  } else if "app" in [tags] {
    mutate {
      add_field => { "[@metadata][index_prefix]" => "calculator-app-logs" }
    }
  } else if "collectdlog" in [tags] {
    mutate {
      add_field => { "[@metadata][index_prefix]" => "calculator-collectd-logs" }
    }
  }
}

output {
  elasticsearch {
    id          => "calculator-elasticsearch"
    hosts       => ["${ELASTICSEARCH_HOSTS:http://elasticsearch:9200}"]
    index       => "%{[@metadata][index_prefix]}-%{+YYYY.MM.dd}"
    ilm_enabled => false
  }
}
