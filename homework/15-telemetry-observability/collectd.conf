# collectd.conf - Telemetry for the Go calculator microservice.
#
# Read plugins sample host/container metrics, the exec plugin turns the state of
# the calculator (/calc/history) into custom metrics, and write_http ships every
# value list to Logstash as a JSON array over HTTP.

Hostname  "calculator"
Interval  10
Timeout   5

LoadPlugin cpu
LoadPlugin memory
LoadPlugin load
LoadPlugin uptime
LoadPlugin interface
LoadPlugin exec
LoadPlugin write_http
LoadPlugin log_logstash

# Without IgnoreSelected the interface plugin treats "Interface" as a
# select list and reports only the named devices, so ask it to ignore lo
# instead and keep the container's real interface.
<Plugin interface>
  Interface       "lo"
  IgnoreSelected  true
</Plugin>

# The exec plugin refuses to run a program as root, so the metrics script is
# run as an unprivileged user. It only needs to read /calc/history over HTTP.
<Plugin exec>
  Exec "nobody" "/usr/local/bin/calculator-metrics.sh"
</Plugin>

<Plugin write_http>
  <Node "logstash">
    URL           "http://logstash:8080/"
    Format        JSON
    BufferSize    16384
    Metrics       true
    Statistics    false
    Notifications false
    LogHttpError  true
  </Node>
</Plugin>

<Plugin log_logstash>
  LogLevel "info"
  File     "/var/log/calculator/collectd-logs.json"
</Plugin>
